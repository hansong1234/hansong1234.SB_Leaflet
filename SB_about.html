<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageBurn-tracks</title>

    <style>
        /* ==================================================
           1. 전체 디자인 기본 설정
           ==================================================
           자주 바꾸는 값들을 위에 모아둔 곳입니다.
           색상, 한 화면에 보일 책 개수 등을 여기서 바꿀 수 있습니다.
        */
        :root {
            --bg-color: #050505;          /* 전체 배경색 */
            --text-red: #ff0000;       /* PART 제목 */
            --text-white: #ffffff;        /* 기본 흰색 글자 */
        }

        /* 모든 요소의 크기 계산을 안정적으로 맞춤 */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-white);

            /*
                현재는 책장 느낌을 위해 serif 계열 글씨체를 사용합니다.
                모바일 앱 같은 깔끔한 느낌으로 바꾸고 싶으면
                아래 font-family를 Arial, sans-serif 등으로 바꾸면 됩니다.
            */
            font-family: 'Times New Roman', serif;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px;
            overflow-x: hidden; /* 페이지 전체가 가로로 밀리는 것 방지 */
        }

        /* ==================================================
           2. 상단 헤더 영역
           ================================================== */
        .site-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 10px;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 6px;
            letter-spacing: 2px;
            line-height: 1.4;
        }

        .logo .num {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }

        /* 메뉴 버튼 */
        .menu-button {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 1rem;
            background: none;
            border: 1px solid white;
            color: white;
            padding: 8px 12px;
            cursor: pointer;
        }
        /* 슬라이드 메뉴 */
        #slide-menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 250px;
            height: 100%;
            background-color: rgba(15, 15, 26, 0.95);
            color: white;
            padding: 60px 20px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.5);
            transition: right 0.4s ease;
            z-index: 999;
        }
        #slide-menu ul {
            list-style: none;
            padding: 0;
        }
        #slide-menu li {
            margin-bottom: 20px;
        }
        #slide-menu a,
        #slide-menu span {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            cursor: pointer;
        }
        #slide-menu .has-submenu ul {
            display: none;
            margin-top: 10px;
            padding-left: 15px;
            font-size: 0.95rem;
        }
        #slide-menu.open {
            right: 0;
        }
        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* ==================================================
           3. PART 제목 영역
           ================================================== */
        .section-header {
            width: 100%;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .section-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 15px;
            min-width: 0;
        }

        .section-header h2 {
            color: var(--text-red);
            font-size: 1.4rem;
            margin: 0;
            font-weight: normal;
            white-space: nowrap;
        }

        .section-header span {
            font-size: 12px;
            opacity: 0.5;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* 스크롤바 숨김 */
        .books-row.scrollable::-webkit-scrollbar {
            display: none;
        }

        .books-row.scrollable {
            scrollbar-width: none;
        }

        /* ==================================================
           5. 좌우 이동 버튼
           ================================================== */
        .shelf-arrow {
            display: none;
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            z-index: 5;
            width: 28px;
            height: 44px;
            border: none;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            font-family: inherit;
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
        }

        .shelf-arrow.left {
            left: -8px;
        }

        .shelf-arrow.right {
            right: -8px;
        }

        .about-page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .intro-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .intro-photo {
            width: 40%;          /* 왼쪽 세로 사진 */
            object-fit: cover;
            border-radius: 8px;
        }

        .intro-text {
            flex: 1;             /* 오른쪽 텍스트 영역 */
        }

        .intro-text h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-red);
        }

        .intro-text p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .banner-section {
            margin: 40px 0;
        }

        .banner-photo {
            width: 100%;         /* 가로 사진은 전체 폭 */
            border-radius: 8px;
        }

        .description-section {
            text-align: center;
            margin: 40px 0;
        }

        .description-section h2 {
            font-size: 1.8rem;
            color: var(--text-red);
            margin-bottom: 15px;
        }

        .description-section p {
            font-size: 1rem;
            line-height: 1.6;
        }




        /* 작은 화면 대응 */
        @media (max-width: 360px) {
            body {
                padding: 16px;
            }

            .section-header h2 {
                font-size: 1.25rem;
            }

            .shelf-arrow {
                width: 24px;
                height: 40px;
                font-size: 1.4rem;
            }
            .menu-button {
                font-size: 0.9rem;
                padding: 6px 10px;
                right: 20px;
            }

            #slide-menu {
                width: 200px;
                padding: 40px 15px;
            }

            .book-meta {
                padding: 20px 5px 8px;
            }

            .book-title {
                font-size: 0.55rem;
            }

            .book-composer {
                font-size: 0.4rem;
            }
        }

    </style>
</head>
<body>
    <header>
        <!-- 메뉴 버튼 -->
        <button class="menu-button" onclick="toggleMenu()">☰</button>
        <!-- 슬라이드 메뉴 -->
        <div id="slide-menu">
            <!-- 닫기 버튼 -->
            <button class="close-button" onclick="toggleMenu()">✕</button>
            <ul>
                <li><a href="SB_about.html">동아리 소개</a></li>
                <li><a href="tracks.html">트랙리스트</a></li>
                <li><a href="playlist.html">플레이리스트</a></li>
            </ul>
        </div>
        <div class="site-header">
        <div class="logo">
        <span class="num">STAGE BURN</span>
            HANKYOUNG HIP-HOP CLUB
        </div>
    </div>

    <main class="about-page">
    <!-- 왼쪽 세로 사진 + 오른쪽 텍스트 -->
    <section class="intro-section">
    <img src="img/sbimg2.webp" alt="세로 사진" class="intro-photo">
    <div class="intro-text">
      <h1>STAGE BURN</h1>
      <p>한경국립대학교<br>
        유일 힙합 동아리</p>
    </div>
  </section>

  <!-- 아래 가로 사진 -->
  <section class="banner-section">
    <img src="img/sbimg1.webp" alt="가로 사진" class="banner-photo">
  </section>

  <!-- 그 아래 중간 글씨 텍스트 -->
  <section class="description-section">
    <p>
      넘치는 열정을 담아 공연을 준비하여<br>
      Hip-Hop, 그리고 R&B 커버 및 자작곡을<br>
      무대 위에서 다채롭게 선보입니다.
    </p>
  </section>
</main>

    </header>

    <div class="section profile-section" style="text-align:center;">
            <div>
                <a href="https://soundcloud.com/stage-burn" target="_blank" style="font-size: 2rem; margin-right: 12px;">🎧</a>
                <a href="https://www.instagram.com/hknu_stageburn" target="_blank" style="font-size: 2rem; margin-right: 12px;">📸</a>
                <a href="https://youtube.com/@stageburn" target="_blank" style="font-size: 2rem;">📺</a>
            <br><br><br>


            <br>
            </div>
        </div>
    <script>
        // 메뉴
        function toggleMenu() {
            const menu = document.getElementById("slide-menu");
            menu.classList.toggle("open");
        }

        function toggleSubMenu() {
            const submenu = document.getElementById("sub-menu");
            submenu.style.display = submenu.style.display === "block" ? "none" : "block";
        }
    </script>
</body>
</html>
