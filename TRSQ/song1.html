<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Detail</title>

    <style>
        /* ==================================================
           1. 기본 색상 / 스타일 설정
           ==================================================
           전체적인 투명 카드 느낌, 글자색 등을 여기서 조절합니다.
        */
        :root {
            --text-main: #ffffff;
            --text-soft: rgba(255, 255, 255, 0.8);
            --text-faint: rgba(255, 255, 255, 0.55);

            --card-bg: rgba(255, 255, 255, 0.18);
            --card-border: rgba(255, 255, 255, 0.18);
            --card-shadow: rgba(0, 0, 0, 0.35);

            --button-bg: rgba(255, 255, 255, 0.10);
            --button-hover: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            /*
                기본 글씨체는 깔끔한 플레이어 느낌을 위해 sans-serif를 사용했습니다.
                책 느낌으로 바꾸고 싶으면 아래 font-family를 바꾸면 됩니다.

                현재:
                font-family: Arial, sans-serif;

                책 느낌:
                font-family: 'Times New Roman', serif;
            */
            font-family: Arial, sans-serif;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 18px;
            overflow: hidden;
            position: relative;

            background-color: #111;
            color: var(--text-main);
        }

        /* ==================================================
           2. 배경 이미지 전용 레이어
           ==================================================
           body에 직접 배경을 넣지 않고, 배경 전용 레이어를 따로 둡니다.

           이유:
           - 배경 이미지만 흐릿하게 만들 수 있음
           - 플레이어 카드와 글자는 선명하게 유지됨
           - background-size: contain으로 배경이 확대되지 않게 함
        */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;

            background-color: #111;

            /*
                cover  : 화면을 꽉 채우지만 이미지가 확대/잘릴 수 있음
                contain: 이미지 전체가 보이지만 빈 공간이 생길 수 있음

                지금은 확대되지 않게 하려고 contain을 사용합니다.
            */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;

            /*
                배경 이미지만 흐릿하게 만드는 부분입니다.
                숫자가 커질수록 더 뿌옇게 보입니다.

                덜 흐리게: blur(4px)
                더 흐리게: blur(12px)
            */
            filter: blur(8px);
            transform: scale(1.03);
        }

        /*
            배경 위에 어두운 막을 살짝 덮어서
            하얀 반투명 카드와 글자가 더 잘 보이게 합니다.
        */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.32);
            z-index: 1;
            pointer-events: none;
        }

        /* ==================================================
           3. 전체 플레이어 카드
           ==================================================
           사진처럼 하얀색 반투명 카드 느낌을 내는 핵심 영역입니다.
        */
        .player-card {
            width: 100%;
            max-width: 410px;

            /*
                카드 전체가 화면 안에 들어오도록 높이를 고정합니다.
                이렇게 해야 아래쪽 둥근 모서리가 화면 밖으로 밀리지 않습니다.
            */
            height: calc(100vh - 36px);
            height: calc(100dvh - 36px);
            max-height: calc(100dvh - 36px);

            position: relative;
            z-index: 2;

            border-radius: 34px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 18px 50px var(--card-shadow);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            padding: 22px 18px 18px;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;

            /*
                카드 내부 내용이 밖으로 삐져나가서
                아래 모서리가 직사각형처럼 보이는 문제를 막습니다.
            */
            overflow: hidden;
        }

        /* ==================================================
           4. 상단 영역
           ================================================== */
        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .back-btn {
            border: none;
            background: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .song-count {
            font-size: 0.8rem;
            color: var(--text-soft);
            letter-spacing: 1px;
        }

        /* ==================================================
           5. 앨범 표지
           ==================================================
           여기에 공연 포스터 PNG가 들어갑니다.
        */
        .cover-wrap {
            /*
                기존보다 앨범 표지 크기를 조금 줄였습니다.
                더 작게 하고 싶으면 width를 74%, 70%처럼 줄이면 됩니다.
            */
            width: 82%;
            max-width: 280px;
            aspect-ratio: 1 / 1;

            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto 16px;

            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
            flex-shrink: 0;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* ==================================================
           6. 곡 정보 + 가사보기 버튼
           ==================================================
           요청한 구조:

           곡 제목 입력
           작곡가 입력                         가사보기
        */
        .song-info {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .song-info-left {
            min-width: 0;
        }

        .song-title {
            margin: 0 0 6px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            margin: 0;
            font-size: 0.88rem;
            color: var(--text-soft);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lyrics-open-btn {
            border: none;
            border-radius: 999px;

            padding: 7px 12px;

            background: rgba(255, 255, 255, 0.16);
            color: var(--text-main);

            font-size: 0.78rem;
            cursor: pointer;
            white-space: nowrap;

            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        .lyrics-open-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* ==================================================
           7. 진행 바 영역
           ================================================== */
        .progress-section {
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .progress-bar {
            width: 100%;
            cursor: pointer;
            accent-color: #ffffff;
        }

        .time-row {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.74rem;
            color: var(--text-faint);
        }

        /* ==================================================
           8. 재생 버튼 영역
           ================================================== */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .control-btn {
            border: none;
            background: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 4px;
            font-size: 1.7rem;
            line-height: 1;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.7rem;
            transition: background 0.2s ease;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ==================================================
           9. 볼륨 영역
           ================================================== */
        .volume-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            flex-shrink: 0;
        }

        .volume-icon {
            font-size: 0.8rem;
            color: var(--text-faint);
            flex-shrink: 0;
        }

        .volume-bar {
            width: 100%;
            cursor: pointer;
            accent-color: #ffffff;
        }

        /* ==================================================
           10. 가사 페이지
           ==================================================
           가사보기 버튼을 누르면 열리는 전체 오버레이입니다.
        */
        .lyrics-page {
            position: fixed;
            inset: 0;
            z-index: 20;

            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lyrics-page.open {
            opacity: 1;
            pointer-events: auto;
        }

        .lyrics-panel {
            width: calc(100% - 36px);
            max-width: 410px;
            height: calc(100vh - 36px);
            height: calc(100dvh - 36px);

            border-radius: 34px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            padding: 22px 18px 18px;

            display: flex;
            flex-direction: column;
        }

        .lyrics-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-shrink: 0;
        }

        .lyrics-back-btn {
            border: none;
            background: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
        }

        .lyrics-panel-title {
            margin: 0;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lyrics-spacer {
            width: 24px;
            flex-shrink: 0;
        }

        .lyrics-scroll {
            overflow-y: auto;
            white-space: pre-line;
            line-height: 1.8;
            font-size: 0.95rem;
            color: var(--text-soft);
            padding-right: 2px;
        }

        /* ==================================================
           11. 모바일 미세 조정
           ================================================== */
        @media (max-width: 360px) {
            body {
                padding: 14px;
            }

            .player-card {
                height: calc(100vh - 28px);
                height: calc(100dvh - 28px);
                max-height: calc(100dvh - 28px);
                padding: 18px 16px 16px;
                border-radius: 28px;
            }

            .cover-wrap {
                width: 78%;
                max-width: 250px;
                margin-bottom: 14px;
            }

            .song-info {
                margin-bottom: 12px;
            }

            .controls {
                gap: 20px;
                margin-bottom: 10px;
            }

            .play-btn {
                width: 56px;
                height: 56px;
            }

            .lyrics-panel {
                width: calc(100% - 28px);
                height: calc(100vh - 28px);
                height: calc(100dvh - 28px);
                border-radius: 28px;
                padding: 18px 16px 16px;
            }
        }
    </style>
</head>

        <section class="progress-section">

            <div class="time-row">

        <section class="controls">

            <button class="control-btn" id="nextBtn" type="button" aria-label="다음 곡">⏭</button>
        </section>

        <section class="volume-section">
            <span class="volume-icon">🔈</span>
            <input
                class="volume-bar"
                id="volumeBar"
                type="range"
                min="0"
                max="1"
                value="1"
                step="0.01"

                <div class="lyrics-spacer"></div>

            <div class="lyrics-scroll" id="lyricsText"></div>

    </section>

        /* ==================================================
           13. 아래는 기능 코드입니다
           특별한 이유가 없으면 수정하지 않는 것이 좋습니다.
           ================================================== */

        const bgLayerEl = document.getElementById("bgLayer");

        const songCountEl = document.getElementById("songCount");
        const coverImgEl = document.getElementById("coverImg");
        const songTitleEl = document.getElementById("songTitle");
        const artistNameEl = document.getElementById("artistName");
        const audioEl = document.getElementById("audio");

        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const durationTimeEl = document.getElementById("durationTime");

        const prevBtn = document.getElementById("prevBtn");
        const playBtn = document.getElementById("playBtn");
        const nextBtn = document.getElementById("nextBtn");
        const volumeBar = document.getElementById("volumeBar");

        const backBtn = document.getElementById("backBtn");

        const openLyricsBtn = document.getElementById("openLyricsBtn");
        const closeLyricsBtn = document.getElementById("closeLyricsBtn");
        const lyricsPage = document.getElementById("lyricsPage");
        const lyricsTitleEl = document.getElementById("lyricsTitle");
        const lyricsTextEl = document.getElementById("lyricsText");

        function padNumber(number) {
            return String(number).padStart(2, "0");
        }

        function formatTime(seconds) {
            if (Number.isNaN(seconds) || !Number.isFinite(seconds)) {
                return "0:00";
            }

            const minutes = Math.floor(seconds / 60);
            const remainSeconds = Math.floor(seconds % 60);

            return minutes + ":" + String(remainSeconds).padStart(2, "0");
        }

        function getPrevSongNumber() {
            return songNumber === 1 ? totalSongs : songNumber - 1;
        }

        function getNextSongNumber() {
            return songNumber === totalSongs ? 1 : songNumber + 1;
        }

        function moveToSong(targetSongNumber) {
            window.location.href = "song" + targetSongNumber + ".html";
        }

        function setSongInfo() {
            /*
                배경 이미지 적용
                body가 아니라 bgLayer에 넣어야
                배경만 흐릿하게 처리됩니다.
            */
            bgLayerEl.style.backgroundImage = `url('${backgroundPath}')`;

            songCountEl.textContent = padNumber(songNumber) + " / " + padNumber(totalSongs);
            coverImgEl.src = imagePath;
            coverImgEl.alt = songTitle + " 앨범 표지";
            songTitleEl.textContent = songTitle;
            artistNameEl.textContent = artistName;

            lyricsTitleEl.textContent = songTitle;
            lyricsTextEl.textContent = lyrics.trim();

            audioEl.src = audioPath;
        }

        function togglePlay() {
            if (audioEl.paused) {
                if (audioEl.currentTime === audioEl.duration) {
                    audioEl.currentTime = 0;
                }
                audioEl.play();
            } else {
                audioEl.pause();
            }
        }

        audioEl.addEventListener("loadedmetadata", function () {
            durationTimeEl.textContent = formatTime(audioEl.duration);
            progressBar.max = audioEl.duration;
        });

        audioEl.addEventListener("play", function () {
            playBtn.textContent = "❚❚";
            playBtn.setAttribute("aria-label", "일시정지");
        });

        audioEl.addEventListener("pause", function () {
            playBtn.textContent = "▶";
            playBtn.setAttribute("aria-label", "재생");
        });

        audioEl.addEventListener("timeupdate", function () {
            progressBar.value = audioEl.currentTime;
            currentTimeEl.textContent = formatTime(audioEl.currentTime);
        });

        progressBar.addEventListener("input", function () {
            audioEl.currentTime = progressBar.value;
            currentTimeEl.textContent = formatTime(audioEl.currentTime);
        });

        audioEl.addEventListener("ended", function () {
            playBtn.textContent = "▶";
            playBtn.setAttribute("aria-label", "재생");
            progressBar.value = audioEl.duration;
            currentTimeEl.textContent = formatTime(audioEl.duration);
        });

        volumeBar.addEventListener("input", function () {
            audioEl.volume = volumeBar.value;
        });

        prevBtn.addEventListener("click", function () {
            moveToSong(getPrevSongNumber());
        });

        playBtn.addEventListener("click", togglePlay);

        nextBtn.addEventListener("click", function () {
            moveToSong(getNextSongNumber());
        });

        backBtn.addEventListener("click", function () {
            window.location.href = "../playlist.html";
        });

        openLyricsBtn.addEventListener("click", function () {
            lyricsPage.classList.add("open");
        });

        closeLyricsBtn.addEventListener("click", function () {
            lyricsPage.classList.remove("open");
        });

        window.scrollTo(0, 0);
        setSongInfo();
    </script>
</body>
