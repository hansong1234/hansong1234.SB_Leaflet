<head>

  <style>
    body {

      overflow-x: hidden;

      position: relative;

    }

    .menu-button {

      border: 1px solid white;

      padding: 8px 12px;

    }

    .logo-img {

      height: auto;

    }

    .info {

      font-size: 1rem;
      opacity: 0.8;
    }


    /* 슬라이드 메뉴 기본 스타일 */
#slide-menu {
  position: fixed;
  top: 0;
  right: -300px; /* 처음엔 화면 밖에 숨김 */
  width: 250px;
  height: 100%;
  background-color: rgba(15, 15, 26, 0.95); /* 반투명 배경 */
  color: white;
  padding: 60px 20px;
  box-shadow: -2px 0 10px rgba(0, 0, 0, 0.5);
  transition: right 0.4s ease;
  z-index: 999;
}

#slide-menu ul {
  list-style: none;
  padding: 0;
}

#slide-menu li {
  margin-bottom: 20px;
}

#slide-menu a, #slide-menu span {
  color: white;
  text-decoration: none;
  font-size: 1rem;
  cursor: pointer;
}

#slide-menu .has-submenu ul {
  display: none;
  margin-top: 10px;
  padding-left: 15px;
  font-size: 0.95rem;
}

/* 메뉴 열릴 때 클래스 */
#slide-menu.open {
  right: 0;
}

/* ✅ 모바일 전용 스타일 */
  @media screen and (max-width: 768px) {
    .menu-button {
      font-size: 0.9rem;
      padding: 6px 10px;
      right: 20px;
    }

    #slide-menu {
      width: 200px;
      padding: 40px 15px;
    }

    .hero-text img {
      max-width: 90%;
    }

    .lp-image {

    }

    .text1 {
      font-size: 2rem;
    }
    .text2 {

    }

    }

    /* 텍스트 이미지 위치 조정 */
    .hero-text img:last-child {
      left: 40px !important;
      max-width: 60% !important;
    }
  }
.close-button {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
}

.section {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 2.5s ease, transform 2.5s ease;
  text-align: left;
}

.section.in-view {
  opacity: 1;
  transform: translateY(0);
}

.link-button {
  display: inline-block;
  margin: 2px;
  padding: 7px 10px;
  background-color: ghostwhite;
  color: black;
  text-decoration: none;
  font-family: 'Malgun Gothic', sans-serif;
  border-radius: 6px;
  transition: background-color 0.3s ease;
  }
.link-button:hover {
  background-color: ghostwhite;
}

.tracklist {
  text-align: left;
  align-self: flex-start;
  padding-left: 40px;
  overflow: hidden;   /* 추가 */
  width: 100%;        /* 화면 너비에 맞추기 */
}

* {
  box-sizing: border-box;
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
}

  </style>
</head>
<body>
  <header>
        <!-- 메뉴 버튼 -->
        <button class="menu-button" onclick="toggleMenu()">☰</button>
        <!-- 슬라이드 메뉴 -->
        <div id="slide-menu">
            <!-- 닫기 버튼 -->
            <button class="close-button" onclick="toggleMenu()">✕</button>
            <ul>

                <li><a href="playlist.html">플레이리스트</a></li>

    <!-- 메인 화면 이동 로고 이미지 -->
       <a id="photo-link" href="index.html">
            <img src="img/SB_logo.webp" alt="로고 사진" class="logo-img">
        </a>
    <!-- 날짜 및 장소 정보 -->
    <div class="tracklist">
    <div class="section text1"><br>Part.1</div>
    <div class="section text2">
        <br>노땡큐 (cover)
        <div class="section text3">신윤학 김진우 송태웅</div>
        <br>Bounce
        <div class="section text3">송태웅 장용하</div>
        <br>HUNNIT BANDS
        <div class="section text3">원태연 정의인 송태웅 신윤학</div>
        <br>탈피
        <div class="section text3">송태웅 전종현</div>
        <br>X
        <div class="section text3">정예원 신지민</div>
    </div>
    <div class="section text1"><br><br><br>Part.2</div>
    <div class="section text2">
        <br>MLJ
        <div class="section text3">김진우 신윤학</div>
        <br>I did it
        <div class="section text3">원태연 장용하 홍준표</div>
        <br>P.R.A.D.A
        <div class="section text3">김진우 전종현</div>
        <br>발칙
        <div class="section text3">신윤학 송태웅</div>

        <div class="section text3">송태웅 신윤학 전종현 손하은 유희수</div>
    <br><br>
    </div>

    <div class="slide-handle" id="slideHandle" title="2부 보기"></div>
  </header>

<script>
  function toggleMenu() {
    const menu = document.getElementById("slide-menu");
    menu.classList.toggle("open");
  }

  function toggleSubMenu() {
    const submenu = document.getElementById("sub-menu");
    submenu.style.display = submenu.style.display === "block" ? "none" : "block";
  }



  // 스크롤 시 섹션이 화면에 들어올 때 페이드 인 애니메이션
    document.addEventListener("DOMContentLoaded", () => {
      const sections = document.querySelectorAll(".section");

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("in-view");
                // 한 번 보인 섹션은 더 이상 관찰하지 않음
                observer.unobserve(entry.target);
              }
            });
          },
          {
            threshold: 0.2,
          }
        );

        sections.forEach((sec) => observer.observe(sec));
      } else {
        // 오래된 브라우저용: 그냥 즉시 보이게
        sections.forEach((sec) => sec.classList.add("in-view"));
      }
    });
    let currentSlide = 0;



</script>
</body>
